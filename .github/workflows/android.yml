name: Android build

# main / PRs: unit tests + debug APK (downloadable from the run's artifacts).
# Tags vX.Y.Z: unit tests + signed release APK published as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          name=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building Becoming $name"

      - name: Tag must match VERSION_NAME
        if: env.IS_RELEASE == 'true'
        run: |
          if [ "v${{ steps.version.outputs.name }}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=${{ steps.version.outputs.name }} in gradle.properties"
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK
        if: env.IS_RELEASE != 'true'
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Becoming-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Signed release APK
        if: env.IS_RELEASE == 'true'
        env:
          BECOMING_KEYSTORE: ${{ runner.temp }}/release.p12
          BECOMING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BECOMING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BECOMING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Becoming-$GITHUB_REF_NAME.apk"

      - name: Release notes from CHANGELOG
        if: env.IS_RELEASE == 'true'
        run: |
          awk -v v="${{ steps.version.outputs.name }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Becoming ${{ github.ref_name }}
          body_path: release-notes.md
          files: Becoming-${{ github.ref_name }}.apk
